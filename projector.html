<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>SAT QUEST Live Board</title><link rel="icon" href="images/parikrama-logo.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/satquest.css"><script src="js/config.js"></script></head>
<body class="sq-home"><canvas id="stars"></canvas>
<div id="pjLock"><img src="images/parikrama-logo.png" width="90" style="border-radius:50%" alt=""><div class="sq-eyebrow">ORGANISERS ONLY</div><input id="pin" type="password" placeholder="PIN" autofocus><div class="sqerr" id="pinErr"></div></div>
<div class="sq-wrap pj" style="max-width:1400px">
  <div class="pj-head"><div class="pj-live">LIVE</div><h1 class="sq-title" style="font-size:clamp(2.4rem,6vw,5rem);margin:.1em 0">SAT QUEST</h1><div class="sq-eyebrow">INNOVISION 2026 &middot; PARIKRAMA SATELLITE CLUB &middot; NIT ROURKELA</div></div>
  <div class="pj-top" id="top"></div>
  <table class="pj-list"><tbody id="rest"></tbody></table>
  <div class="pj-msg" id="msg"></div>
  <div class="pj-hint">Press F for fullscreen &middot; updates every 10 seconds</div>
</div>
<script>
function fmt(t){t=Math.max(0,Number(t)||0);return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')}
var timer=null;
function unlock(){document.getElementById('pjLock').style.display='none';sessionStorage.setItem('pj','1');load();timer=setInterval(load,10000)}
var PIN=String((window.SQ&&SQ.ORGANISER_PIN)||'');
if(!PIN||sessionStorage.getItem('pj')==='1')unlock();
document.getElementById('pin').onkeydown=function(e){if(e.key==='Enter'){if(this.value===PIN)unlock();else{document.getElementById('pinErr').textContent='Wrong PIN';this.value=''}}};
addEventListener('keydown',function(e){if((e.key==='f'||e.key==='F')&&e.target.tagName!=='INPUT'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}});
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e}
function render(rows){var top=document.getElementById('top'),rest=document.getElementById('rest'),msg=document.getElementById('msg');top.innerHTML='';rest.innerHTML='';
msg.textContent=rows.length?'':'Waiting for the first team to launch...';
rows.slice(0,3).forEach(function(r,i){var c=el('div','pj-card p'+(i+1));c.appendChild(el('div','pj-rank','#'+(i+1)));c.appendChild(el('div','pj-name',r.team));c.appendChild(el('div','pj-score',r.score));c.appendChild(el('div','pj-meta','Cost '+r.cost+' · Time left '+fmt(r.timeLeft)));top.appendChild(c)});
rows.slice(3,10).forEach(function(r,i){var tr=el('tr');tr.appendChild(el('td','',i+4));tr.appendChild(el('td','',r.team));tr.appendChild(el('td','m','Cost '+r.cost+' · '+fmt(r.timeLeft)));tr.appendChild(el('td','s',r.score));rest.appendChild(tr)})}
function load(){var msg=document.getElementById('msg');
if(!(window.SQ&&SQ.SHEET_URL)){msg.textContent='Not connected yet. Add the Google Sheet URL in js/config.js.';return}
fetch(SQ.SHEET_URL).then(function(r){return r.json()}).then(function(d){render(d.rows||[])}).catch(function(){msg.textContent='Could not load scores. Retrying...'})}
(function(){var c=document.getElementById('stars'),x=c.getContext('2d'),s=[];function r(){c.width=innerWidth;c.height=innerHeight;s=[];for(var i=0;i<140;i++)s.push({x:Math.random()*c.width,y:Math.random()*c.height,r:Math.random()*1.3+.2,p:Math.random()*6})}
addEventListener('resize',r);r();(function d(t){x.clearRect(0,0,c.width,c.height);x.fillStyle='#cfc6ff';s.forEach(function(a){x.globalAlpha=.4+.6*Math.abs(Math.sin(t/1400+a.p));x.beginPath();x.arc(a.x,a.y,a.r,0,7);x.fill()});requestAnimationFrame(d)})(0)})();
</script></body></html>
